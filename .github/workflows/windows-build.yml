name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build installer and portable executable
        run: npx electron-builder --win nsis portable --config.win.signAndEditExecutable=false --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Lyrics-Island-Windows
          path: |
            release/LyricsIsland-Setup-*.exe
            release/LyricsIsland-Portable-*.exe
          if-no-files-found: error
