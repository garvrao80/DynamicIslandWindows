<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lyrics Island</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="island" class="island" aria-label="Lyrics Island">
      <section class="compact">
        <div id="art" class="art"></div>
        <div class="meta">
          <div id="track" class="track">Lyrics Island</div>
          <div id="lyric" class="lyric" title="">Starting...</div>
        </div>
        <div class="controls">
          <button id="previous" class="icon-button" title="Previous" aria-label="Previous"></button>
          <button id="play" class="icon-button primary" title="Play or pause" aria-label="Play or pause"></button>
          <button id="next" class="icon-button" title="Next" aria-label="Next"></button>
        </div>
      </section>

      <section class="expanded">
        <button id="collapse" class="icon-button close-button" title="Collapse" aria-label="Collapse"></button>
        <button id="resizeHandle" class="resize-handle icon-button" type="button" title="Resize expanded island" aria-label="Resize expanded island"></button>

        <div class="expanded-grid">
          <aside class="now-playing">
            <div id="expandedArt" class="expanded-art"></div>
            <div class="expanded-meta">
              <div id="expandedTrack" class="expanded-track">Lyrics Island</div>
              <div id="expandedArtist" class="expanded-artist">Windows floating lyrics</div>
            </div>

            <div class="expanded-controls">
              <button id="expandedPrevious" class="icon-button" title="Previous" aria-label="Previous"></button>
              <button id="expandedPlay" class="icon-button primary" title="Play or pause" aria-label="Play or pause"></button>
              <button id="expandedNext" class="icon-button" title="Next" aria-label="Next"></button>
              <button id="settingsToggle" class="icon-button" title="Settings" aria-label="Settings"></button>
            </div>

            <div class="progress" aria-label="Playback progress">
              <span id="progressElapsed" class="progress-time">0:00</span>
              <div class="progress-track">
                <div id="progressFill" class="progress-fill"></div>
              </div>
              <span id="progressDuration" class="progress-time">0:00</span>
            </div>

            <div id="status" class="status">Ready</div>
          </aside>

          <section class="lyric-panel">
            <div class="lyrics-window">
              <div id="lyricsList" class="lyrics-list"></div>
            </div>
          </section>
        </div>

        <form id="settings" class="settings-popover" aria-label="Settings">
          <input id="clientId" name="clientId" placeholder="Spotify Client ID" autocomplete="off" />
          <div class="settings-row">
            <label class="toggle">
              <input id="demoMode" type="checkbox" />
              <span>Demo</span>
            </label>
            <label class="offset">
              <span>Offset</span>
              <input id="offset" type="number" step="100" />
            </label>
            <label class="opacity-slider">
              <span>Opacity</span>
              <input id="opacity" type="range" min="10" max="100" value="100" />
            </label>
          </div>
          <div class="settings-actions">
            <button id="dashboard" type="button">Dashboard</button>
            <button id="connect" type="button">Connect</button>
            <button type="submit">Save</button>
          </div>
        </form>
      </section>
    </main>

    <script src="./renderer.js"></script>
  </body>
</html>
