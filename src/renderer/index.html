<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"
    />
    <title>Lyrics Island</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="island" class="island" aria-label="Lyrics Island">
      <svg id="notchOutline" aria-hidden="true"><path fill="none" stroke="rgba(245,255,251,.15)" /></svg>
      <div id="dockGlow" aria-hidden="true"></div>
      <section class="compact">
        <div id="art" class="art"></div>
        <div class="meta">
          <div id="track" class="track">Lyrics Island</div>
          <div id="lyric" class="lyric" title="">Starting...</div>
        </div>
        <div class="controls">
          <button id="previous" class="icon-button" title="Previous" aria-label="Previous"></button>
          <button id="play" class="icon-button primary" title="Play or pause" aria-label="Play or pause"></button>
          <button id="next" class="icon-button" title="Next" aria-label="Next"></button>
        </div>
      </section>

      <section class="expanded">
        <button id="collapse" class="icon-button close-button" title="Collapse" aria-label="Collapse"></button>
        <button id="resizeHandle" class="resize-handle icon-button" type="button" title="Resize expanded island" aria-label="Resize expanded island"></button>

        <div class="expanded-grid">
          <aside class="now-playing">
            <div id="expandedArt" class="expanded-art"></div>
            <div class="expanded-meta">
              <div id="expandedTrack" class="expanded-track">Lyrics Island</div>
              <div id="expandedArtist" class="expanded-artist">Windows floating lyrics</div>
            </div>

            <div class="expanded-controls">
              <button id="expandedPrevious" class="icon-button" title="Previous" aria-label="Previous"></button>
              <button id="expandedPlay" class="icon-button primary" title="Play or pause" aria-label="Play or pause"></button>
              <button id="expandedNext" class="icon-button" title="Next" aria-label="Next"></button>
              <button id="settingsToggle" class="icon-button" title="Settings" aria-label="Settings"></button>
            </div>

            <div class="progress" aria-label="Playback progress">
              <span id="progressElapsed" class="progress-time">0:00</span>
              <div class="progress-track">
                <div id="progressFill" class="progress-fill"></div>
              </div>
              <span id="progressDuration" class="progress-time">0:00</span>
            </div>

            <div id="status" class="status">Ready</div>
          </aside>

          <section class="lyric-panel">
            <button id="backToLive" type="button" hidden>Back to live</button>
            <div class="lyrics-window">
              <div id="lyricsList" class="lyrics-list"></div>
            </div>
          </section>
        </div>

        <form id="settings" class="settings-popover" aria-label="Settings">
          <input hidden id="clientId" name="clientId" placeholder="Spotify Client ID" autocomplete="off" />
          <div class="settings-row">
            <select id="playbackSource" aria-label="Playback source">
              <option value="windows">Spotify on this PC</option>
              <option value="web">Spotify Web API</option>
              <option value="demo">Demo</option>
            </select>
            <label class="toggle">
              <input id="startAtLogin" type="checkbox" />
              <span>Start with Windows</span>
            </label>
          </div>
          <div class="settings-row">
            <label class="offset">
              <span>Global offset</span>
              <input id="offset" type="number" step="100" />
            </label>
            <label class="opacity-slider">
              <span>Opacity</span>
              <input id="opacity" type="range" min="10" max="100" value="100" />
            </label>
          </div>
          <div class="settings-actions">
            <output id="songTiming">Song: 0 ms</output>
            <button type="button" data-timing="early" title="Delay this song’s lyrics by 250 ms">Lyrics early</button>
            <button type="button" data-timing="late" title="Advance this song’s lyrics by 250 ms">Lyrics late</button>
            <button type="button" data-timing="reset" aria-label="Reset this song’s timing">Reset</button>
          </div>
          <div class="settings-row">
            <label>Show/hide shortcut
              <select id="shortcut">
                <option value="">Off</option>
                <option>Ctrl+Alt+L</option>
                <option>Ctrl+Shift+F9</option>
                <option>Alt+Shift+I</option>
              </select>
            </label>
            <label class="toggle"><input type="checkbox" id="snapEdges" /> Snap to edges</label>
          </div>
          <div class="settings-actions">
            <button type="button" id="importLrc">Import .lrc for song</button>
            <button type="button" id="removeLrc" hidden>Use automatic lyrics</button>
          </div>
          <output id="settingsMessage" aria-live="polite"></output>
          <div class="settings-actions">
            <button hidden id="dashboard" type="button">Dashboard</button>
            <button hidden id="connect" type="button">Connect</button>
            <button type="submit">Save</button>
          </div>
        </form>
      </section>
    </main>

    <script src="./renderer.js"></script>
    <script src="./notch.js"></script>
  </body>
</html>
